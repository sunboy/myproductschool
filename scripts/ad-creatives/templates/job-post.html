<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_tokens.css" />
<style>
  /* Job-post: fake job listing card with one real highlighted phrase, pose peeking over. */
  .ad-root { background: var(--cream); }

  .stage {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    padding: 150px 84px 80px;
    text-align: center;
  }

  .eyebrow { font-size: 28px; color: var(--forest); }

  .headline {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--charcoal);
    letter-spacing: -0.02em;
    line-height: 1.06;
    text-align: center;
  }
  .ratio-9x16 .headline { font-size: 82px; }
  .ratio-4x5  .headline { font-size: 74px; }
  .ratio-1x1  .headline { font-size: 64px; }

  /* card stack: pose behind, card on top */
  .card-scene {
    position: relative;
    width: 100%;
    max-width: 780px;
    /* extra top space for pose peeking out */
    margin-top: 100px;
  }

  .pose-peek {
    position: absolute;
    top: -140px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
  }
  .pose-peek img { width: 220px; height: auto; }
  .ratio-1x1 .pose-peek img { width: 180px; }

  /* the job listing card */
  .job-card {
    position: relative;
    z-index: 2;
    background: var(--paper);
    border: 3px solid var(--mist);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 60px -30px rgba(30, 33, 28, 0.32);
  }

  /* forest header bar */
  .job-card-header {
    background: var(--forest);
    padding: 22px 32px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .job-logo-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #fff;
    flex: 0 0 auto;
  }
  .job-title-lines {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .job-title-line {
    height: 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.30);
  }
  .job-title-line-wide { width: 72%; }
  .job-title-line-narrow { width: 45%; }

  /* body of the card */
  .job-card-body {
    padding: 28px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .text-bar {
    height: 14px;
    border-radius: 999px;
    background: var(--mist);
  }

  /* real highlighted phrase */
  .phrase-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 0;
  }
  .phrase-bullet {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink-3);
    flex: 0 0 auto;
  }
  .phrase-text {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 32px;
    color: var(--charcoal);
    line-height: 1.3;
    position: relative;
    display: inline;
  }
  /* amber highlighter behind the phrase text */
  .phrase-text::before {
    content: '';
    position: absolute;
    inset: -4px -8px -4px -8px;
    background: rgba(196, 166, 106, 0.45);
    border-radius: 6px;
    transform: rotate(-0.8deg);
    z-index: -1;
  }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    margin-top: 16px;
  }
  .sub { font-size: 34px; color: var(--ink-2); font-weight: 600; line-height: 1.4; max-width: 820px; }
  .cta-pill { font-size: 36px; padding: 28px 68px; }

  .brand-chip { position: absolute; top: 150px; left: 84px; font-size: 34px; }
  .ratio-1x1 .brand-chip, .ratio-4x5 .brand-chip { top: 56px; left: 64px; }
</style>
</head>
<body>
<div class="ad-root" id="root">
  <div class="brand-chip">HackProduct</div>
  <div class="stage">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="headline"></h1>

    <div class="card-scene">
      <!-- pose peeking over the card top edge -->
      <div class="pose-peek" id="pose-peek">
        <img id="pose" alt="" />
      </div>

      <!-- fake job listing card -->
      <div class="job-card">
        <div class="job-card-header">
          <div class="job-logo-circle"></div>
          <div class="job-title-lines">
            <div class="text-bar job-title-line job-title-line-wide"></div>
            <div class="text-bar job-title-line job-title-line-narrow"></div>
          </div>
        </div>
        <div class="job-card-body" id="card-body">
          <!-- text bars + phrase inserted by JS -->
        </div>
      </div>
    </div>

    <div class="footer">
      <p class="sub" id="sub"></p>
      <div class="cta-pill" id="cta"></div>
    </div>
  </div>
  <div class="safe-guides"></div>
</div>
<script>
  const d = window.__AD_DATA__
  const root = document.getElementById('root')
  root.classList.add('ratio-' + d.ratio, 'palette-' + (d.palette || 'cream'))
  if (new URLSearchParams(location.search).get('guides')) document.body.classList.add('show-guides')

  if (d.hook && d.hook.eyebrow) {
    document.getElementById('eyebrow').textContent = d.hook.eyebrow
  } else {
    document.getElementById('eyebrow').remove()
  }
  document.getElementById('headline').textContent = (d.hook && d.hook.headline) || ''
  if (d.hook && d.hook.sub) {
    document.getElementById('sub').textContent = d.hook.sub
  } else {
    document.getElementById('sub').remove()
  }
  document.getElementById('cta').textContent = (d.hook && d.hook.cta) || ''

  // build card body: bars surrounding the real phrase at position ~3
  const body = document.getElementById('card-body')
  const widths = ['88%', '65%', '78%', '55%', '70%', '48%']

  widths.forEach(function(w, i) {
    if (i === 2) {
      // insert the real highlighted phrase row here
      const phraseRow = document.createElement('div')
      phraseRow.className = 'phrase-row'
      const bullet = document.createElement('div')
      bullet.className = 'phrase-bullet'
      const span = document.createElement('span')
      span.className = 'phrase-text'
      span.textContent = (d.data && d.data.phrase) || 'thinks in tradeoffs'
      phraseRow.appendChild(bullet)
      phraseRow.appendChild(span)
      body.appendChild(phraseRow)
    }
    const bar = document.createElement('div')
    bar.className = 'text-bar'
    bar.style.width = w
    body.appendChild(bar)
  })

  // pose
  const img = document.getElementById('pose')
  if (d.poseUrl) {
    img.src = d.poseUrl
  } else {
    document.getElementById('pose-peek').remove()
  }
</script>
</body>
</html>
