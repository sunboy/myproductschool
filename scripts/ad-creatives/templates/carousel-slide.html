<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_tokens.css" />
<style>
  /* Carousel-slide: parameterized 1x1 slide, 5 kinds for Instagram carousels. */
  .ad-root { background: var(--cream); }

  /* slide counter chip top-right (under safe zone) */
  .slide-chip {
    position: absolute;
    top: 56px;
    right: 64px;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 26px;
    color: var(--ink-3);
    background: var(--paper);
    border: 2px solid var(--mist);
    border-radius: 999px;
    padding: 8px 24px;
    z-index: 10;
  }

  .brand-chip { position: absolute; top: 56px; left: 64px; font-size: 34px; z-index: 10; }
  .ratio-9x16 .brand-chip { top: 150px; left: 84px; }
  .ratio-9x16 .slide-chip  { top: 150px; right: 84px; }
  .ratio-4x5  .brand-chip  { top: 80px; left: 84px; }
  .ratio-4x5  .slide-chip  { top: 80px; right: 84px; }

  /* ── shared stage ── */
  .stage {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 140px 80px;
    gap: 40px;
    text-align: center;
  }

  /* ── kind: hook ── */
  .hook-eyebrow { font-size: 28px; color: var(--forest); }
  .hook-headline {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--charcoal);
    letter-spacing: -0.02em;
    line-height: 1.06;
  }
  .ratio-9x16 .hook-headline { font-size: 92px; }
  .ratio-4x5  .hook-headline { font-size: 82px; }
  .ratio-1x1  .hook-headline { font-size: 72px; }

  /* ── kind: question ── */
  .q-eyebrow { font-size: 28px; color: var(--forest); margin-bottom: 4px; }
  .q-card {
    background: var(--paper);
    border: 3px solid var(--mist);
    border-radius: 28px;
    padding: 52px 56px;
    max-width: 860px;
    box-shadow: 0 16px 40px -24px rgba(30,33,28,0.28);
    width: 100%;
  }
  .q-text {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .ratio-9x16 .q-text { font-size: 68px; }
  .ratio-4x5  .q-text { font-size: 60px; }
  .ratio-1x1  .q-text { font-size: 52px; }

  /* ── kind: options ── */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 860px;
  }
  .option-card {
    display: flex;
    align-items: center;
    gap: 24px;
    background: var(--paper);
    border: 3px solid var(--mist);
    border-radius: 20px;
    padding: 22px 32px;
  }
  .option-letter {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--forest);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 900;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .option-text {
    font-size: 30px;
    font-weight: 700;
    color: var(--ink-2);
    line-height: 1.3;
    text-align: left;
  }
  .ratio-9x16 .option-text { font-size: 34px; }

  /* ── kind: distribution ── */
  .dist-stat {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--forest);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .ratio-9x16 .dist-stat { font-size: 200px; }
  .ratio-4x5  .dist-stat { font-size: 180px; }
  .ratio-1x1  .dist-stat { font-size: 160px; }

  .dist-text {
    font-size: 38px;
    font-weight: 700;
    color: var(--ink-2);
    line-height: 1.4;
    max-width: 780px;
  }

  /* ── kind: cta ── */
  .cta-statement {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--charcoal);
    letter-spacing: -0.02em;
    line-height: 1.06;
    max-width: 820px;
  }
  .ratio-9x16 .cta-statement { font-size: 80px; }
  .ratio-4x5  .cta-statement { font-size: 72px; }
  .ratio-1x1  .cta-statement { font-size: 64px; }

  .cta-pose img { width: 280px; height: auto; }
  .ratio-1x1 .cta-pose img { width: 220px; }

  .cta-pill { font-size: 36px; padding: 28px 68px; }
</style>
</head>
<body>
<div class="ad-root" id="root">
  <div class="brand-chip">HackProduct</div>
  <div class="slide-chip" id="slide-chip"></div>
  <div class="stage" id="stage">
    <!-- content inserted by JS based on slide kind -->
  </div>
  <div class="safe-guides"></div>
</div>
<script>
  const d = window.__AD_DATA__
  const root = document.getElementById('root')
  root.classList.add('ratio-' + d.ratio, 'palette-' + (d.palette || 'cream'))
  if (new URLSearchParams(location.search).get('guides')) document.body.classList.add('show-guides')

  // slide counter chip
  const index = (d.data && d.data.index != null) ? d.data.index : null
  const total = (d.data && d.data.total != null) ? d.data.total : null
  const chip = document.getElementById('slide-chip')
  if (index != null && total != null) {
    chip.textContent = index + '/' + total
  } else {
    chip.remove()
  }

  const stage = document.getElementById('stage')
  const slide = (d.data && d.data.slide) || {}
  const kind = slide.kind || 'hook'

  function el(tag, cls, text) {
    var e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }

  if (kind === 'hook') {
    if (slide.eyebrow) stage.appendChild(el('div', 'eyebrow hook-eyebrow', slide.eyebrow))
    stage.appendChild(el('h1', 'hook-headline', slide.text || ''))

  } else if (kind === 'question') {
    stage.appendChild(el('div', 'eyebrow q-eyebrow', 'The question'))
    var card = el('div', 'q-card')
    card.appendChild(el('p', 'q-text', slide.text || ''))
    stage.appendChild(card)

  } else if (kind === 'options') {
    var letters = ['A', 'B', 'C', 'D']
    var opts = (slide.options && slide.options.length) ? slide.options : []
    var list = el('div', 'options-list')
    opts.forEach(function(optText, i) {
      var card = el('div', 'option-card')
      card.appendChild(el('div', 'option-letter', letters[i] || String(i + 1)))
      card.appendChild(el('div', 'option-text', optText || ''))
      list.appendChild(card)
    })
    stage.appendChild(list)

  } else if (kind === 'distribution') {
    stage.appendChild(el('div', 'dist-stat', slide.stat || ''))
    stage.appendChild(el('p', 'dist-text', slide.text || ''))

  } else if (kind === 'cta') {
    stage.appendChild(el('p', 'cta-statement', slide.text || ''))
    if (d.poseUrl) {
      var poseWrap = el('div', 'cta-pose')
      var img = document.createElement('img')
      img.src = d.poseUrl
      img.alt = ''
      poseWrap.appendChild(img)
      stage.appendChild(poseWrap)
    }
    var ctaText = slide.cta || (d.hook && d.hook.cta) || ''
    if (ctaText) {
      stage.appendChild(el('div', 'cta-pill', ctaText))
    }
  }
</script>
</body>
</html>
